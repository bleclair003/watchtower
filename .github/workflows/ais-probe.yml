# One-off: measures what aisstream.io delivers for the chokepoint boxes, using the
# AISSTREAM_API_KEY repository secret. Prints counts only.
name: AIS probe

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to listen (5-120)
        default: '60'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: ${{ inputs.seconds }}
        run: node collector/ais-probe.ts "$LISTEN_SECONDS"
