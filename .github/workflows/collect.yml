# Scheduled collection: fetch public sources → Firestore → rebuild dashboard snapshot.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   Variable  WATCHTOWER_PROJECT_ID     Firebase project id
#   Secret    FIREBASE_SERVICE_ACCOUNT  Service-account key JSON (role: Cloud Datastore User)
#   Secret    DISCORD_WEBHOOK_URL       Optional Discord webhook for alert notifications
#
# Trigger: an external scheduler (cron-job.org) calls workflow_dispatch every 30 minutes (:17 and :47)
# with inputs.trigger = schedule (docs/DEPLOYMENT.md §4c). GitHub's own cron is best-effort and
# skipped 5 consecutive hourly runs on 2026-11-21, so it is kept only as a 6-hourly fallback.
# The concurrency group below stops two runs from collecting at the same time.
# The dashboard flags the collector as OVERDUE after 3 h.
name: Collect

on:
  schedule:
    - cron: '2 */6 * * *' # fallback only; minute 2 avoids the external :17/:47 slots
  workflow_dispatch:
    inputs:
      trigger:
        description: Recorded as the run trigger
        type: choice
        options: [manual, schedule]
        default: manual

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Collect
        env:
          WATCHTOWER_PROJECT_ID: ${{ vars.WATCHTOWER_PROJECT_ID }}
          COLLECTOR_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
          METADATA_SERVER_DETECTION: none
          # Optional: alert notifications. Unset → alerts are still recorded in the app.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional free-key sources. Unset → the source is skipped as NOT CONFIGURED.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
        # Exit 2 (a source failed) fails the job so GitHub notifies the repository owner.
        run: node collector/run.ts
