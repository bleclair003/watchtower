# One-off: checks that Kystverket's open AIS stream is reachable from a runner. Prints counts only.
name: Kystverket probe

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to listen (5-120)
        default: '30'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe
        env:
          LISTEN_SECONDS: ${{ inputs.seconds }}
        run: node scripts/kystverket-probe.ts "$LISTEN_SECONDS"
